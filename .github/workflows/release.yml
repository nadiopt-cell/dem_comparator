name: Release

# On a vX.Y.Z tag: build the plugin ZIP with qgis-plugin-ci and attach it
# to the GitHub release. Issue #9 — release packaging is automatic.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-and-upload:
    name: Package ZIP and attach to release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install qgis-plugin-ci
        run: python -m pip install qgis-plugin-ci

      - name: Build the plugin ZIP
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          qgis-plugin-ci package "$VERSION"

      - name: Attach ZIP to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ZIP=$(ls *.zip | head -n 1)
          echo "Uploading $ZIP to release $TAG"
          # Create the release if it does not exist yet, then upload.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$TAG" "$ZIP" --repo "$GITHUB_REPOSITORY" --clobber
