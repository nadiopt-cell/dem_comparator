name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Ruff check
        run: python -m ruff check .

  tests:
    name: Tests (plain Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest numpy
      - name: Run test suite
        run: python -m pytest tests/ -v
        # GDAL/QGIS-dependent tests skip themselves here and run in the
        # test-qgis job below.

  test-qgis:
    name: Tests (QGIS docker, full suite)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # Run via `docker run` (not a `container:` job): the qgis/qgis image
      # entrypoint is not suited to GitHub's container lifecycle. Passing the
      # test command as CMD makes the entrypoint exec it directly.
      # qgis/qgis:3.40 is the current LTR image (the "final-3" tag does not
      # exist on Docker Hub).
      - name: Run full test suite inside QGIS
        run: |
          set -x
          docker run --rm -v "$PWD":/io -w /io qgis/qgis:3.40 bash -xc '
            echo "=== python: $(python3 --version) ===" &&
            python3 -m pip install --break-system-packages pytest 2>&1 | tail -2 &&
            echo "=== starting pytest ===" &&
            xvfb-run -a python3 -m pytest tests/ -v -s
          '
